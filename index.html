  <!-- Single theme-color without media: some Android browsers / installed PWAs ignore media-scoped tags.
       The script below and ThemeProvider set it to match the active theme. -->
  <meta name="theme-color" content="#f8fdef" />
  <script>
    // Apply the saved theme before first paint so the status bar matches from launch
    (function () {
      try {
        var mode = localStorage.getItem("zplit-theme") || "system";
        var isDark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", isDark ? "dim" : "lemonade");
        document.querySelectorAll("meta[name='theme-color']").forEach(function (el) {
          el.setAttribute("content", isDark ? "#2a303c" : "#f8fdef");
        });
      } catch (e) {}
    })();

    // Android Chrome bakes the manifest theme_color into the installed app as its status bar color,
    // while the status bar icons follow the phone's system dark mode. Link the manifest that matches
    // the system scheme so the app is installed with a readable status bar.
    (function () {
      try {
        var mq = matchMedia("(prefers-color-scheme: dark)");
        var sync = function () {
          var link = document.querySelector("link[rel='manifest']");
          if (link) link.setAttribute("href", mq.matches ? "/manifest-dark.webmanifest" : "/manifest.webmanifest");
        };
        sync();
        mq.addEventListener("change", sync);
      } catch (e) {}
    })();
  </script>
  <title>Zplit | 長期分帳與共同生活帳本</title>

  <script>
    // Capture beforeinstallprompt before React mounts to avoid race condition.
    // React hooks (useEffect) run after the first render, so the event can
    // fire and be missed if we only listen inside a component.
    window.__pwaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__pwaInstallPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
    });
  </script>
</head>

<body class="bg-base-200 text-base-content font-sans antialiased">
  <div id="root">
    <!-- 首次載入骨架（JS 執行前顯示）：與 src/components/ui/PageSkeleton.tsx 的骨架完全一致，修改時請同步。
         預設是 Home 骨架，邀請連結（/join/<code>）由下面的 script 換成 Join 骨架 -->
    <div class="relative flex h-full min-h-[inherit] flex-col overflow-hidden" aria-busy="true">
      <main class="flex-1 overflow-y-auto pb-16">
        <div class="px-4 pt-4 pb-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <img src="/favicon.svg" alt="Zplit Logo" class="w-8 h-8" />
              <h1 class="text-2xl font-extrabold tracking-tight text-brand">Zplit</h1>
            </div>
            <div class="skeleton h-8 w-8 rounded-full"></div>
          </div>
          <div class="mt-4">
            <div class="flex h-7 items-center"><div class="skeleton h-5 w-32"></div></div>
            <div class="flex h-5 items-center"><div class="skeleton h-3.5 w-40"></div></div>
          </div>
          <div class="mt-6 space-y-4">
            <div class="space-y-2">
              <div class="skeleton h-4 w-28"></div>
              <div class="skeleton h-16 w-full rounded-2xl"></div>
              <div class="skeleton h-16 w-full rounded-2xl"></div>
            </div>
            <div class="space-y-2">
              <div class="skeleton h-4 w-32"></div>
              <div class="skeleton h-16 w-full rounded-2xl"></div>
              <div class="skeleton h-16 w-full rounded-2xl"></div>
            </div>
          </div>
        </div>
      </main>
      <div class="dock dock-sm dock-in-frame border-t border-base-300 bg-base-100 pb-safe">
        <div><div class="skeleton h-6 w-6 rounded-md"></div><div class="skeleton h-2.5 w-8"></div></div>
        <div><div class="skeleton h-6 w-6 rounded-md"></div><div class="skeleton h-2.5 w-8"></div></div>
        <div><div class="skeleton h-6 w-6 rounded-md"></div><div class="skeleton h-2.5 w-8"></div></div>
        <div><div class="skeleton h-6 w-6 rounded-md"></div><div class="skeleton h-2.5 w-8"></div></div>
      </div>
    </div>
  </div>

  <!-- 邀請連結的骨架，與 PageSkeleton.tsx 的 JoinSkeleton 一致 -->
  <template id="skeleton-join">
    <div class="flex h-full min-h-[100dvh] flex-col overflow-hidden md:min-h-[inherit]" aria-busy="true">
      <div class="min-h-[3.5rem] shrink-0"></div>
      <div class="flex-1 px-5">
        <div class="mx-auto flex min-h-full w-full max-w-sm flex-col pb-10">
          <div class="skeleton mx-auto mb-4 h-4 w-32 rounded-full"></div>
          <div class="mb-6 flex flex-col items-center gap-2 rounded-2xl border border-base-300 bg-base-100 px-6 py-6 text-center">
            <div class="skeleton h-16 w-16 rounded-full"></div>
            <div class="skeleton mt-1 h-7 w-48 rounded-lg"></div>
            <div class="skeleton h-4 w-24 rounded-md"></div>
          </div>
          <div class="flex-1"></div>
          <div class="skeleton h-12 w-full rounded-xl"></div>
        </div>
      </div>
    </div>
  </template>
  <script>
    // 點邀請連結進來的人是要加入群組的，首次載入就直接顯示加入群組的骨架，
    // 不要先閃一次首頁骨架（同步執行，會在第一次繪製前換好）
    (function () {
      try {
        if (location.pathname.indexOf("/join/") !== 0) return;
        var root = document.getElementById("root");
        var tpl = document.getElementById("skeleton-join");
        if (!root || !tpl) return;
        root.innerHTML = "";
        root.appendChild(tpl.content.cloneNode(true));
      } catch (e) {}
    })();
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
